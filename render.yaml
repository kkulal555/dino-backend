services:
  - type: web
    name: dino-backend
    env: docker
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-db
          property: connectionString

databases:
  - name: wallet-db
    databaseName: wallet_db
    user: wallet_user
    plan: free
    region: singapore
